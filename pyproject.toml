[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webos-foundry"
version = "0.1.0"
description = "CLI, HTTP API, web UI and Home Assistant integration for a rooted LG webOS TV"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "webOS Foundry contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/webos-foundry/webos-foundry"
Issues = "https://github.com/webos-foundry/webos-foundry/issues"

[project.scripts]
wof = "webos_foundry.cli:main"

[tool.setuptools]
packages = ["webos_foundry"]

[tool.setuptools.package-data]
webos_foundry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
