name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan full Git history
        working-directory: ${{ runner.temp }}
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/$checksums" --output "$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
          ./gitleaks git "$GITHUB_WORKSPACE" --redact=100 --no-banner
